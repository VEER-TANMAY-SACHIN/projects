<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Sign In / Register - iConsult</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-midnight">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="brand-logo">
        iConsult <span class="dot"></span>
      </a>
      <a href="index.html" class="btn btn-secondary btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
    </div>
  </header>

  <!-- Auth Card Container -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active">Sign In</div>
        <div id="tab-register" class="auth-tab">Create Account</div>
      </div>

      <!-- Login Form -->
      <form id="form-login" style="display: block;">
        <h2 class="heading-md" style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>

        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@domain.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 1.5rem;">
          <button type="button" id="btn-forgot-password" style="background: none; border: none; color: #818cf8; cursor: pointer; font-size: 0.85rem;">
            Forgot password?
          </button>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%;">
          Sign In <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>

      <!-- Registration Form -->
      <form id="form-register" style="display: none;">
        <h2 class="heading-md" style="margin-bottom: 1.5rem; text-align: center;">Create Your Free Account</h2>

        <div class="form-group">
          <label class="form-label" for="reg-username">Choose Username Handle *</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 0.8rem; color: var(--text-muted);">@</span>
            <input type="text" id="reg-username" class="form-input" style="padding-left: 2.2rem;" placeholder="alex_dev" required />
          </div>
          <span style="font-size: 0.75rem; color: var(--text-muted);">3-20 characters (letters, numbers, underscores)</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-display-name">Display Name</label>
          <input type="text" id="reg-display-name" class="form-input" placeholder="Alex Rivers" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-input" placeholder="alex@domain.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" required minlength="6" />
        </div>

        <button type="submit" id="btn-register-submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Register Account <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { loginUser, registerUser, resetPassword } from './js/auth.js';
    import { showToast } from './js/utils.js';

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');

    // Switch between Sign In and Register tabs
    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = 'block';
      formLogin.style.display = 'none';
    });

    // Handle Login Submit
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('btn-login-submit');

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="loading-spinner"></div> Signing In...';
        await loginUser(email, password);
      } catch (err) {
        showToast(err.message || 'Login failed.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In <i class="fa-solid fa-right-to-bracket"></i>';
      }
    });

    // Handle Register Submit
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const displayName = document.getElementById('reg-display-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const submitBtn = document.getElementById('btn-register-submit');

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="loading-spinner"></div> Creating Account...';
        await registerUser(email, password, username, displayName);
      } catch (err) {
        showToast(err.message || 'Registration failed.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Register Account <i class="fa-solid fa-user-plus"></i>';
      }
    });

    // Handle Password Reset
    document.getElementById('btn-forgot-password').addEventListener('click', async () => {
      const email = prompt('Enter your email address to receive password reset link:');
      if (email) {
        try {
          await resetPassword(email);
        } catch (err) {
          showToast(err.message || 'Failed to send reset link.', 'error');
        }
      }
    });
  </script>
</body>
</html>
